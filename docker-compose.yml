services:
  db:
    container_name: masterly-chatbot-db
    image: postgres:18
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${ADMIN_DB_USERNAME:-chatbot_admin}
      - POSTGRES_PASSWORD=${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USERNAME:-chatbot_admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  sync:
    container_name: masterly-chatbot-sync
    image: postgres:18
    entrypoint: ["bash", "/sync/sync.sh"]
    environment:
      - SOURCE_DB_HOST=${SOURCE_DB_HOST:-host.docker.internal}
      - SOURCE_DB_PORT=${SOURCE_DB_PORT:-2001}
      - SOURCE_DB_DATABASE=${SOURCE_DB_DATABASE:-masterly}
      - SOURCE_DB_USERNAME=${SOURCE_DB_USERNAME:-laravel}
      - SOURCE_DB_PASSWORD=${SOURCE_DB_PASSWORD:-}
      # When set, the source DB above is ignored and this dump (mounted below
      # from ./${SOURCE_DUMP_FILE}) is restored instead. See .env.example.
      - SOURCE_DUMP_FILE=${SOURCE_DUMP_FILE:+/seed/dump}
      # Superuser of the internal Postgres — only this service ever uses it.
      - ADMIN_DB_HOST=db
      - ADMIN_DB_PORT=5432
      - ADMIN_DB_USERNAME=${ADMIN_DB_USERNAME:-chatbot_admin}
      - ADMIN_DB_PASSWORD=${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
      # Read-only role over the snapshot (created here, used by the app).
      - SNAPSHOT_DB_USERNAME=${SNAPSHOT_DB_USERNAME:-chatbot}
      - SNAPSHOT_DB_PASSWORD=${SNAPSHOT_DB_PASSWORD:?set SNAPSHOT_DB_PASSWORD in .env}
      # Read/write role + database for saved chat history (created here, used by
      # the app). Separate from the snapshot, which is dropped every cycle.
      - HISTORY_DB_DATABASE=${HISTORY_DB_DATABASE:-chatbot_app}
      - HISTORY_DB_USERNAME=${HISTORY_DB_USERNAME:-chatbot_app}
      - HISTORY_DB_PASSWORD=${HISTORY_DB_PASSWORD:-}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      - ./sync:/sync:ro
      # Inert placeholder unless SOURCE_DUMP_FILE names a dump on the host.
      - ${SOURCE_DUMP_FILE:-/dev/null}:/seed/dump:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    container_name: masterly-chatbot-app
    build: .
    environment:
      - PORT=8080
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5}
      - CHAT_USERNAME=${CHAT_USERNAME}
      - CHAT_PASSWORD=${CHAT_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Snapshot: read-only, this is what the model's run_sql tool runs as.
      - SNAPSHOT_DB_HOST=db
      - SNAPSHOT_DB_PORT=5432
      - SNAPSHOT_DB_DATABASE=masterly_snapshot
      - SNAPSHOT_DB_USERNAME=${SNAPSHOT_DB_USERNAME:-chatbot}
      - SNAPSHOT_DB_PASSWORD=${SNAPSHOT_DB_PASSWORD}
      # Chat history: same Postgres instance, its own database and read/write role.
      - HISTORY_DB_HOST=db
      - HISTORY_DB_PORT=5432
      - HISTORY_DB_DATABASE=${HISTORY_DB_DATABASE:-chatbot_app}
      - HISTORY_DB_USERNAME=${HISTORY_DB_USERNAME:-chatbot_app}
      - HISTORY_DB_PASSWORD=${HISTORY_DB_PASSWORD:-}
      - CLAUDE_CONFIG_DIR=/root/.claude
    volumes:
      - ./:/app
      # Container home dir: keeps Claude Code's login, settings, session and
      # project history (/root/.claude, /root/.claude.json) plus shell history
      # and the npm cache across `docker compose down` / rebuilds.
      - claude-home:/root
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  claude-home:
